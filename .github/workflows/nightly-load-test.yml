name: Nightly Load Test Regression Check

# Issue #1546 — runs the load test suite nightly against the strict production
# SLA targets in tests/load/PerformanceBaselines.js (NIGHTLY_TARGET_BASELINES:
# POST /donations 200 req/s p95<150ms, GET /donations 500 req/s p95<50ms,
# GET /stats/summary 100 req/s p95<200ms) and files a GitHub issue when any
# scenario's p95 latency exceeds its target by more than 20%.
#
# This is intentionally separate from .github/workflows/load-tests.yml, which
# gates every PR/push merge against the more CI-runner-realistic BASELINES —
# a regression here opens an issue for follow-up rather than blocking a merge,
# so it can safely apply the stricter, unrelaxed targets (no margin env vars).
on:
  schedule:
    # Nightly at 03:00 UTC (offset from load-tests.yml's 02:00 UTC nightly run
    # so the two jobs don't contend for the same runner window).
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly-regression-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run load tests against a local server instance
        env:
          MOCK_STELLAR: 'true'
          NODE_ENV: test
          API_KEYS: 'test-load-key,test-key-1,test-key-2'
          ENCRYPTION_KEY: test_encryption_key_fixed_32bytes_hex_value_here_00
        # No LOAD_TEST_*_MARGIN overrides here — the nightly job measures
        # against the real targets, not a CI-relaxed tolerance.
        run: npm run test:load -- --output ./reports/load --concurrency 20 --iterations 100 --warmup 15
        continue-on-error: true # a failing merge-gate threshold shouldn't skip the regression report below

      - name: Compare results against nightly SLA targets
        id: regression_check
        run: node scripts/check-load-test-regression.js reports/load/load-test-report.json

      - name: Report regressions (idempotent — comment on / close tracking issues)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const LABEL = 'perf-regression';
            const TITLE_PREFIX = 'Performance regression: ';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Ensure the tracking label exists (create is idempotent-ish: 422 if present).
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
              });
            } catch (err) {
              if (err.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: LABEL,
                  color: 'd93f0b',
                  description: 'Automated nightly load-test performance regression tracking',
                });
              } else {
                throw err;
              }
            }

            // Find the single open tracking issue for a scenario, if any.
            async function findOpenTrackingIssue(scenario) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: LABEL,
                per_page: 100,
              });
              const prefix = `${TITLE_PREFIX}${scenario}`;
              // Match exact scenario name (avoid "list-donations" matching "list-donations-v2").
              return data.find(
                (issue) => !issue.pull_request && (issue.title === prefix || issue.title.startsWith(`${prefix} `))
              );
            }

            function metricsTable(regressions) {
              return [
                '| Scenario | Metric | Baseline | Actual | Over threshold |',
                '|---|---|---|---|---|',
                ...regressions.map(r =>
                  `| ${r.scenario} | ${r.metric} | ${r.baseline}ms | ${r.actual}ms | +${r.pctOver}% |`
                ),
              ].join('\n');
            }

            let data;
            try {
              data = JSON.parse(fs.readFileSync('reports/load/regressions.json', 'utf8'));
            } catch (err) {
              core.warning(`Could not read regressions.json: ${err.message}`);
              return;
            }

            const regressions = data.regressions || [];
            const regressedScenarios = new Set(regressions.map(r => r.scenario));

            // 1. Comment on (or open) a tracking issue per regressed scenario.
            for (const scenario of regressedScenarios) {
              const scenarioRegressions = regressions.filter(r => r.scenario === scenario);
              const body = [
                `Nightly load test detected ${scenarioRegressions.length} metric(s) for \`${scenario}\` exceeding the SLA target's p95 latency by more than ${data.thresholdPct}% (issue #1546).`,
                '',
                '### Comparison metrics',
                metricsTable(scenarioRegressions),
                '',
                `Checked at: ${data.checkedAt}`,
                `Workflow run: ${runUrl}`,
                '',
                'Targets are defined in `tests/load/PerformanceBaselines.js` (`NIGHTLY_TARGET_BASELINES`). See `docs/LOAD_TESTING.md` for how to reproduce locally with `npm run test:load`.',
              ].join('\n');

              const existing = await findOpenTrackingIssue(scenario);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                core.info(`Commented on existing tracking issue #${existing.number} for ${scenario}`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `${TITLE_PREFIX}${scenario}`,
                  body,
                  labels: [LABEL, 'performance', 'regression', 'automated'],
                });
                core.info(`Opened tracking issue #${created.number} for ${scenario}`);
              }
            }

            // 2. Auto-close tracking issues for scenarios that have recovered.
            //    Enumerate all open tracking issues so recovered scenarios are found
            //    even when they no longer appear in regressions.json.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });

            for (const issue of openIssues) {
              if (issue.pull_request) continue;
              if (!issue.title.startsWith(TITLE_PREFIX)) continue;
              const scenario = issue.title.slice(TITLE_PREFIX.length).trim();
              if (regressedScenarios.has(scenario)) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  `\`${scenario}\` is back within its SLA p95 latency target — closing this tracking issue.`,
                  '',
                  `Checked at: ${data.checkedAt}`,
                  `Workflow run: ${runUrl}`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed recovered tracking issue #${issue.number} for ${scenario}`);
            }

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-load-test-report
          path: reports/load/
          retention-days: 30
